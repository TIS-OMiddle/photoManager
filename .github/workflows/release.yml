name: Build & Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Build CLI
        run: go build -trimpath -ldflags="-s -w" -o photoManager.exe .

      - name: Build GUI
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o photoManager-gui.exe ./gui

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photoManager-windows
          path: |
            photoManager.exe
            photoManager-gui.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            photoManager.exe
            photoManager-gui.exe
          generate_release_notes: true
